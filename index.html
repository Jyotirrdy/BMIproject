<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>BMI Calculator</h1>
      <p class="subtitle">Enter your height and weight to calculate your Body Mass Index.</p>

      <form id="bmi-form" class="card">
        <label for="height">Height (cm)</label>
        <input id="height" name="height" type="number" min="1" step="0.1" required />

        <label for="weight">Weight (kg)</label>
        <input id="weight" name="weight" type="number" min="1" step="0.1" required />

        <button type="submit">Calculate BMI</button>
      </form>

      <section id="result" class="result" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
